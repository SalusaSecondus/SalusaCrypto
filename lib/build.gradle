plugins {
    // Apply the java-library plugin for API and implementation separation.
    id 'java-library'
    id 'jacoco'
    id "com.google.osdetector" version "1.7.3"
    id 'maven-publish'
    id 'org.jreleaser' version '1.26.0'
}

version = projectVersion

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter
    testImplementation 'com.google.code.gson:gson:2+'
    testImplementation 'org.bouncycastle:bcprov-jdk18on:1+'
    testImplementation "software.amazon.cryptools:AmazonCorrettoCryptoProvider:2.+:${osdetector.classifier}"

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withJavadocJar()
    withSourcesJar()
}

tasks.named('test') {
    environment "CCTV_KATS_PATH", "${project.rootDir}/CCTV/sequencehash"
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

jacocoTestReport {
    dependsOn test // tests are required to run before generating the report
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'dev.salusa'
            artifactId = 'crypto'

            from components.java

            pom {
                name = 'SalusaCrypto'
                description = 'A collection of zero-dependency cryptographic classes and implementations.'
                url = 'https://github.com/SalusaSecondus/SalusaCrypto'
                inceptionYear = '2026'
                licenses {
                    license {
                        name = 'Apache-2.0'
                        url = 'https://spdx.org/licenses/Apache-2.0.html'
                    }
                }
                developers {
                    developer {
                        id = 'salusasecondus'
                        name = 'SalusaSecondus'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/SalusaSecondus/SalusaCrypto.git'
                    developerConnection = 'scm:git:ssh://github.com/SalusaSecondus/SalusaCrypto.git'
                    url = 'https://github.com/SalusaSecondus/SalusaCrypto'
                }
            }
        }
    }

    repositories {
        maven {
            url = layout.buildDirectory.dir('staging-deploy')

        }
    }
}

jreleaser {
  signing {
    pgp {
      active = 'ALWAYS'
      armored = true
    }
  }
  deploy {
    maven {
      mavenCentral {
        sonatype {
          active = 'RELEASE'
          url = 'https://central.sonatype.com/api/v1/publisher'
          stagingRepository('build/staging-deploy')
        }
      }
    }
  }
}